<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Masa 20 - 12 nəfər</title><style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;background:#7ac47a;display:flex;flex-direction:column;font-family:Arial;overflow:hidden}.top{height:48px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 8px}.pill{background:#f5f5f5;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.board{flex:1;position:relative;background:radial-gradient(ellipse at center,#e9b77f 0%,#d49a5a 60%,#b77a3a 100%);overflow:hidden}.slot{position:absolute;width:64px;height:76px;transform:translate(-50%,-50%);text-align:center;z-index:3;cursor:pointer}.slot .av{width:58px;height:58px;border-radius:12px;border:3px solid #fff;object-fit:cover;box-shadow:0 4px 12px rgba(0,0,0,.3);background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}.slot.empty .av{background:#1e1e1e;border-style:dashed;color:#555}.slot .nm{margin-top:3px;background:rgba(0,0,0,.65);color:#fff;font-size:9px;padding:2px 5px;border-radius:8px;display:inline-block}#bottle{position:absolute;left:50%;top:50%;width:38px;height:88px;margin-left:-19px;margin-top:-44px;transform-origin:50% 65%;transition:transform 2.8s cubic-bezier(.15,.8,.2,1);z-index:6;display:flex;flex-direction:column;align-items:center}#bottle .neck{width:14px;height:16px;background:#f5e6a0;border-radius:3px 3px 0 0}#bottle .body{width:38px;height:72px;background:linear-gradient(90deg,#2b0e0e,#6b2020,#2b0e0e);border-radius:10px;display:flex;align-items:center;justify-content:center}#bottle .lbl{background:gold;color:#000;font-weight:900;font-size:9px;padding:2px 5px;border-radius:999px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:700;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.5);z-index:4;pointer-events:none;font-size:11px}.chat{height:36%;background:#fff;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:6px 8px;font-size:12px}.msg{display:flex;gap:6px;margin-bottom:5px}.bubble{background:#f3f3f3;border-radius:10px;padding:4px 7px;max-width:84%}.inputRow{display:flex;gap:6px;padding:6px 8px;border-top:1px solid #eee;align-items:center}.inputRow input{flex:1;border:none;background:#f0f2f5;padding:9px 12px;border-radius:999px;outline:none}.inputRow button{width:32px;height:32px;border-radius:50%;border:none;background:#ff8c00;color:#fff}.profile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;background:#fff;border-radius:20px;z-index:30;display:none;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}.profile.show{display:block}.pTop{height:90px;background:linear-gradient(135deg,#2a1e45,#5a3a6a);position:relative}.pTop img{position:absolute;left:16px;bottom:-26px;width:68px;height:68px;border-radius:14px;border:3px solid #fff}.pBody{padding:34px 14px 14px}.statsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.sCard{background:#f8f7ff;border:1px solid #eee;border-radius:12px;padding:9px;text-align:center}.sCard b{font-size:16px;display:block}.sCard span{font-size:10px;color:#666}.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:25;max-height:62%;display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.3)}.sheet.show{display:flex}.sheetHead{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #eee;font-weight:800}.grid{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gItem{background:#fafafa;border-radius:12px;padding:8px;text-align:center;border:1px solid #eee;cursor:pointer}</style></head><body>
<div class="top"><div class="pill" id="heartTop">🧡 5000</div><div class="pill" id="hourInfo">⏰ 60:00 +200</div><div class="pill" id="masaName">Masa 20 - 1/12</div><div style="margin-left:auto;display:flex;gap:6px"><div class="pill" onclick="location.href='index.html'">← Ana</div><div class="pill" onclick="spin()">🔄</div></div></div>
<div class="board" id="board"><div class="center" id="center">12 nəfərlik<br>Boş masa</div><div id="bottle"><div class="neck"></div><div class="body"><div class="lbl">VIP</div></div></div><div class="profile" id="pSheet"><div class="pTop"><div style="position:absolute;right:10px;top:10px;display:flex;gap:6px"><div style="background:gold;padding:3px 8px;border-radius:8px;font-weight:800;font-size:11px">VIP</div><div onclick="pSheet.classList.remove('show')" style="width:26px;height:26px;background:rgba(0,0,0,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff">✕</div></div><img id="pImg" src=""></div><div class="pBody"><div style="display:flex;justify-content:space-between"><b id="pName">Oyuncu</b></div><div class="statsGrid"><div class="sCard"><b id="sKiss">0</b><span>💋 Öpüş</span></div><div class="sCard"><b id="sMusic">22.222</b><span>🎵 Mahnı</span></div><div class="sCard"><b id="sSmile">0</b><span>😊 Smaylik</span></div><div class="sCard"><b id="sSpent">0</b><span>💸 Xərclədiyin</span></div><div class="sCard" style="grid-column:span 2;background:#fff0f5"><b id="sGift">22</b><span>🌹 Uxaj</span></div></div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="addMusic(5)" style="background:#7ac47a;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700">🎵 5 ürəkli (+0.005)</button><button onclick="addMusic(9)" style="background:#5ab85a;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700">🎶 9 ürəkli (+0.009)</button><button onclick="doKiss()" style="background:#ff5a8a;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700">💋 Öp</button><button onclick="giveSmile()" style="background:#f0f2f5;border:none;padding:10px;border-radius:10px">😊 Smaylik</button><button onclick="giveUxaj()" style="background:#ffe0eb;border:none;padding:10px;border-radius:10px;font-weight:700">🌹 Uxaj +1</button><button onclick="spendHearts()" style="background:#1e1332;color:#fff;border:none;padding:10px;border-radius:10px">💸 10 ürək</button></div></div></div></div>
<div class="chat"><div class="msgs" id="msgs"><div class="msg"><div class="bubble" style="background:#fffbe6">Sistem: 12 nəfərlik masa! İlk giriş 5000 🧡 (bir dəfəlik) + hər saat 200. Mahnı 22.222 → 5=22.227, 9=22.231</div></div></div><div class="inputRow"><button onclick="openSheet()">😊 🎁</button><input id="inp" placeholder="Mesaj yaz..."><button onclick="sendMsg()">➤</button></div></div><div class="sheet" id="sheet"><div class="sheetHead"><span>Mahnı / Hədiyyə</span><span onclick="sheet.classList.remove('show')" style="width:28px;height:28px;background:#f0f0f0;border-radius:50%;display:flex;align-items:center;justify-content:center">✕</span></div><div class="grid" id="grid"></div></div>
<script>
let deviceId=localStorage.getItem('deviceId');if(!deviceId){deviceId='dev_'+Date.now();localStorage.setItem('deviceId',deviceId);}let myName=localStorage.getItem('myName')||'Qonaq_'+deviceId.slice(-3);localStorage.setItem('myName',myName);let hearts=parseInt(localStorage.getItem('hearts')||'0');let firstGiven=localStorage.getItem('firstBonusGiven');let lastHour=parseInt(localStorage.getItem('lastHourBonus')||'0');let totalSpent=parseInt(localStorage.getItem('totalSpent')||'0');if(!firstGiven){hearts+=5000;localStorage.setItem('hearts',hearts);localStorage.setItem('firstBonusGiven','1');localStorage.setItem('lastHourBonus',Date.now());lastHour=Date.now();}function updateHour(){let now=Date.now();if(now-lastHour>=3600000){hearts+=200;localStorage.setItem('hearts',hearts);localStorage.setItem('lastHourBonus',now);lastHour=now;}let remain=3600000-(Date.now()-lastHour);if(remain<0)remain=0;let mm=Math.floor(remain/60000).toString().padStart(2,'0');let ss=Math.floor((remain%60000)/1000).toString().padStart(2,'0');hourInfo.innerText='⏰ '+mm+':'+ss+' | +200';heartTop.innerText='🧡 '+hearts;}setInterval(updateHour,1000);updateHour();let players=JSON.parse(localStorage.getItem('gamePlayers12')||'[]');if(players.length==0){players=[{n:myName,img:'https://i.pravatar.cc/150?img=11',x:50,y:88,music:22.222,kiss:0,smile:0,spent:0,uxaj:22}];localStorage.setItem('gamePlayers12',JSON.stringify(players));}let slots=[{x:18,y:10},{x:50,y:6},{x:82,y:10},{x:8,y:28},{x:92,y:28},{x:8,y:52},{x:92,y:52},{x:8,y:80},{x:30,y:88},{x:50,y:90},{x:70,y:88},{x:92,y:80}];let cur=null,rot=0;function render(){document.querySelectorAll('.slot').forEach(e=>e.remove());slots.forEach((s,i)=>{let p=players[i];let d=document.createElement('div');d.className='slot'+(p?'':' empty');d.style.left=s.x+'%';d.style.top=s.y+'%';if(p){d.innerHTML=`<img class="av" src="${p.img}"><div class="nm">${p.n}</div>`;d.onclick=()=>openProfile(p);}else{d.innerHTML=`<div class="av">+</div><div class="nm">Boş</div>`;d.onclick=()=>{let n=prompt('Dost adı:');if(n){players[i]={n,img:'https://i.pravatar.cc/150?img='+(i+12),x:s.x,y:s.y,music:22.222,kiss:0,smile:0,spent:0,uxaj:22};save();render();}};}board.appendChild(d);});masaName.innerText=`Masa 20 - ${players.length}/12`;}function save(){localStorage.setItem('gamePlayers12',JSON.stringify(players));}function openProfile(p){cur=p;pImg.src=p.img;pName.innerText=p.n;sKiss.innerText=p.kiss||0;sMusic.innerText=(p.music||22.222).toFixed(3);sSmile.innerText=p.smile||0;sSpent.innerText=p.spent||0;sGift.innerText=p.uxaj||22;pSheet.classList.add('show');}function addMusic(cost){if(hearts<cost){alert(cost+' ürək lazımdır');return;}hearts-=cost;cur.spent=(cur.spent||0)+cost;totalSpent+=cost;let add=(cost===5?0.005:0.009);cur.music=(cur.music||22.222)+add;localStorage.setItem('hearts',hearts);localStorage.setItem('totalSpent',totalSpent);save();updateHour();sMusic.innerText=cur.music.toFixed(3);sSpent.innerText=cur.spent;}function doKiss(){cur.kiss=(cur.kiss||0)+1;save();sKiss.innerText=cur.kiss;}function giveSmile(){cur.smile=(cur.smile||0)+1;save();sSmile.innerText=cur.smile;}function giveUxaj(){cur.uxaj=(cur.uxaj||22)+1;save();sGift.innerText=cur.uxaj;}function spendHearts(){if(hearts<10){alert('10 ürək lazımdır');return;}hearts-=10;cur.spent=(cur.spent||0)+10;totalSpent+=10;localStorage.setItem('hearts',hearts);localStorage.setItem('totalSpent',totalSpent);save();updateHour();sSpent.innerText=cur.spent;}function addMsg(name,text){let d=document.createElement('div');d.className='msg';d.innerHTML=`<div class="bubble"><b>${name}:</b> ${text}</div>`;msgs.appendChild(d);msgs.scrollTop=9999;}function spin(){if(players.length<2){alert('Ən azı 2 nəfər');return;}let pick=players[Math.floor(Math.random()*players.length)];let ang=Math.atan2(pick.y-50,pick.x-50)*180/Math.PI;rot+=1080+ang;bottle.style.transform='rotate('+rot+'deg)';setTimeout(()=>openProfile(pick),2800);}function sendMsg(){let v=inp.value.trim();if(!v)return;addMsg(myName,v);inp.value='';}render();
</script></body></html>
