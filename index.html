<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Spinnthebottle.com - Online</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:#d2a06a;font-family:system-ui;display:flex;flex-direction:column;overflow:hidden}
.header{height:48px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.table{flex:1;background:radial-gradient(ellipse at center,#f2d09b 0%,#e6b97e 55%,#c98a4a 100%);position:relative}
.player{position:absolute;width:70px;text-align:center}
.player img{width:60px;height:60px;border-radius:12px;border:2px solid #fff;object-fit:cover}
.player span{font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:2px 4px;border-radius:6px;display:block;margin-top:2px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:200px;background:radial-gradient(circle,#ffe7b6,#d9a46a);border-radius:40%;display:flex;align-items:center;justify-content:center}
#bottle{width:50px;transition:transform 3.2s cubic-bezier(.15,.85,.25,1)}
#hint{position:absolute;top:78%;left:50%;transform:translateX(-50%);background:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.bottom{height:40%;background:#fff;display:flex;flex-direction:column}
.gifts{display:flex;gap:6px;padding:6px;overflow:auto;border-bottom:1px solid #eee}
.gifts div{background:#f5f5f5;padding:6px 10px;border-radius:12px;font-size:13px}
.chat{flex:1;overflow:auto;padding:6px;font-size:13px}
.inputRow{display:flex;padding:6px;gap:6px;border-top:1px solid #eee}
.inputRow input{flex:1;background:#f0f0f0;border:1px solid #ddd;border-radius:20px;padding:10px 14px}
.inputRow button{background:#ff7a00;color:#fff;border:none;width:36px;height:36px;border-radius:50%}
#login{position:absolute;inset:0;background:radial-gradient(#f2d09b,#c98a4a);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
#login input{padding:12px 16px;border-radius:999px;border:none;margin-top:10px;width:200px;text-align:center}
#login button{background:#fff;border:none;padding:12px 20px;border-radius:999px;font-weight:800;margin-top:12px}
#modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:14px;width:180px;text-align:center;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="header"><b>🍾 Spinnthebottle.com</b><div>Masa 1905</div></div>
<div class="table" id="table">
<div id="login"><h2>🍾 Spinnthebottle.com</h2><p>Putulka.com kimi</p><input id="nameInp" placeholder="Adini yaz"><button onclick="start()">Oyuna Gir</button></div>
<div class="center" onclick="spin()"><img id="bottle" src="https://i.imgur.com/QkZ8vM9.png"><div id="hint">Cevir!</div></div>
<div id="modal"><img id="mImg" width="70" style="border-radius:12px"><h3 id="mName"></h3><div id="timer" style="font-size:22px;font-weight:800">9</div><button onclick="closeM()" style="margin-top:8px;padding:6px 12px;border-radius:10px;border:none;background:#eee">Bagla</button></div>
</div>
<div class="bottom"><div class="gifts"><div>🎁</div><div>🌹</div><div>👑</div><div>💋</div><div>🍓</div><div>🍒</div></div><div class="chat" id="chat"><div>Sistem: Xos geldin!</div></div><div class="inputRow"><input id="msgInp" placeholder="Mesaj"><button onclick="send()">></button></div></div>
<script>
let myName='';let players=[];let rot=0;let spinning=false;let selected=null;
const defaults=[{id:1,name:'Alya',img:'https://i.pravatar.cc/150?img=9'},{id:2,name:'Tomris',img:'https://i.pravatar.cc/150?img=32'},{id:3,name:'Roy',img:'https://i.pravatar.cc/150?img=11'},{id:4,name:'Nick',img:'https://i.pravatar.cc/150?img=15'},{id:5,name:'Qiz',img:'https://i.pravatar.cc/150?img=22'},{id:6,name:'Amara',img:'https://i.pravatar.cc/150?img=26'}];
function start(){let v=document.getElementById('nameInp').value.trim();if(!v)return alert('Ad yaz');myName=v;document.getElementById('login').style.display='none';players=[{id:0,name:myName,img:'https://i.pravatar.cc/150?img=5',me:true},...defaults];render();}
function render(){let t=document.getElementById('table');t.querySelectorAll('.player').forEach(e=>e.remove());players.forEach((p,i)=>{let tot=players.length;let ang=(i/tot)*360-90;let rad=ang*Math.PI/180;let x=50+Math.cos(rad)*36;let y=50+Math.sin(rad)*36;let d=document.createElement('div');d.className='player';d.style.left=x+'%';d.style.top=y+'%';d.innerHTML=`<img src="${p.img}"><span>${p.name}</span>`;t.appendChild(d);});}
function spin(){if(spinning)return;spinning=true;let b=document.getElementById('bottle');let others=players.filter(p=>!p.me);selected=others[Math.floor(Math.random()*others.length)];let idx=players.indexOf(selected);let target=(idx/players.length)*360-90+90;rot+=1080+Math.random()*360+target;b.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{document.getElementById('mImg').src=selected.img;document.getElementById('mName').innerText=selected.name;document.getElementById('modal').style.display='block';spinning=false;},3200);}
function closeM(){document.getElementById('modal').style.display='none';}
function send(){let i=document.getElementById('msgInp');if(!i.value)return;let c=document.getElementById('chat');let d=document.createElement('div');d.innerHTML=`<b>${myName}:</b> ${i.value}`;c.appendChild(d);c.scrollTop=c.scrollHeight;i.value='';}
</script>
</body>
</html>
